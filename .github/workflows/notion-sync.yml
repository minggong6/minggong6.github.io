name: Notion Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: notion-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/notion-sync/requirements.txt

      - name: Sync Notion page to post
        run: python scripts/notion-sync/sync.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: 3c86c74e-657a-8054a134e507933557de
          POST_TITLE: 从0到GPT到VLA
          POST_SLUG: 从0到GPT到VLA
          POST_TAGS: "VLA, 笔记"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync: update 从0到GPT到VLA from Notion"
          file_pattern: "_posts/* assets/notion/*"
